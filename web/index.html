<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>SeeForMe</title>
  <meta name="description" content="Predictive, action-aware audio cues from your camera for blind and low-vision navigation." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="top">
      <div class="brand"><span class="dot" id="live-dot" aria-hidden="true"></span><h1>SeeForMe</h1></div>
      <div class="status" id="status" role="status" aria-live="polite">Starting…</div>
    </header>

    <main class="stage">
      <div class="view">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay" aria-hidden="true"></canvas>
        <div class="cue-card" id="cue-card" aria-hidden="true">
          <div class="cue-kind" id="cue-kind"></div>
          <div class="cue-text" id="cue-text"></div>
          <div class="cue-meta" id="cue-meta"></div>
        </div>
      </div>
      <!-- the screen-reader channel: every spoken cue is also announced here -->
      <div id="sr-live" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
    </main>

    <section class="controls" aria-label="Controls">
      <div class="row modes" role="tablist" aria-label="Mode">
        <button class="mode active" data-mode="navigate" role="tab" aria-selected="true">Navigate</button>
        <button class="mode" data-mode="find" role="tab" aria-selected="false">Find</button>
        <button class="mode" data-mode="read" role="tab" aria-selected="false">Read</button>
        <button class="mode" data-mode="ask" role="tab" aria-selected="false">Ask</button>
      </div>
      <div class="row" id="mode-panel">
        <form id="find-form" class="inline hidden"><label for="find-input" class="sr-only">What are you looking for?</label>
          <input id="find-input" placeholder="e.g. exit, room 204, a seat" autocomplete="off" />
          <button type="submit">Find</button><button type="button" id="find-clear">Clear</button></form>
        <div id="read-panel" class="inline hidden"><button id="read-now" class="big">Read text in view</button></div>
        <form id="ask-form" class="inline hidden"><label for="ask-input" class="sr-only">Ask about the scene</label>
          <input id="ask-input" placeholder="What's around me? Any stairs? Where is the door?" autocomplete="off" />
          <button type="submit">Ask</button><button type="button" id="ask-voice" aria-label="Ask by voice">🎤</button></form>
      </div>
      <div class="row main-actions">
        <button id="start" class="big primary">Start camera</button>
        <button id="flip" class="big" aria-label="Flip camera">Flip</button>
        <button id="mute" class="big" aria-pressed="false">Sound on</button>
      </div>
      <div class="row">
        <label class="field">Verbosity
          <select id="verbosity"><option value="quiet">Quiet</option><option value="balanced" selected>Balanced</option><option value="detailed">Detailed</option></select>
        </label>
        <label class="field">Units
          <select id="units"><option value="m">meters</option><option value="ft">feet</option></select>
        </label>
        <label class="field">Voice
          <select id="voice"><option value="browser">Browser</option><option value="elevenlabs">ElevenLabs (server)</option></select>
        </label>
        <label class="field">Camera
          <select id="camera-select"><option value="">auto</option></select>
        </label>
        <label class="field">Video file
          <input id="file-input" type="file" accept="video/*" />
        </label>
      </div>
      <div class="row budget-row">
        <span>Speech budget</span><div class="budget" aria-hidden="true"><div id="budget-fill"></div></div>
        <span id="budget-text">100%</span>
        <button id="debug-toggle" aria-expanded="false">Debug</button>
      </div>
      <div class="last-cue"><span>Last cue:</span> <strong id="last-cue">—</strong></div>
    </section>

    <section id="debug" class="debug hidden" aria-label="Debug view">
      <table><thead><tr><th>track</th><th>dist</th><th>TTC</th><th>path</th><th>hazard</th><th>urg</th><th>U</th></tr></thead>
        <tbody id="debug-rows"></tbody></table>
      <pre id="debug-log"></pre>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
