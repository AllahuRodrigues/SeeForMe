<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7;
          --accent:#0071e3; --speak:#248a3d; --silent:#6e6e73; --wrong:#b25000; --unclear:#8e8e93; --mark:#ff9f0a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#a1a1a6; --line:#38383a;
          --accent:#2997ff; --speak:#30d158; --silent:#98989d; --wrong:#ff9f0a; --unclear:#8e8e93; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; }
  h1 { font-size: 28px; line-height:1.2; margin: 0 0 4px; font-weight:600; letter-spacing:-0.01em; }
  .muted { color: var(--muted); font-size: 15px; }
  .card { background:var(--card); border-radius:18px; padding:20px; margin-top:16px; border:1px solid var(--line); }
  .strip { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; scroll-snap-type:x mandatory; }
  figure { margin:0; flex: 0 0 auto; scroll-snap-align:start; }
  figure img { display:block; height:200px; width:auto; border-radius:10px; border:3px solid transparent; }
  figure.inwin img { border-color: var(--accent); }
  figure.q img { border-color: var(--mark); }
  figcaption { font-size:13px; color:var(--muted); text-align:center; font-variant-numeric: tabular-nums; }
  dl { display:grid; grid-template-columns: max-content 1fr; gap:6px 16px; margin:0; }
  dt { color:var(--muted); } dd { margin:0; }
  .actions { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px; }
  button { font: inherit; font-weight:600; min-height:52px; border-radius:12px; border:2px solid var(--line); background:var(--card);
           color:var(--text); cursor:pointer; padding: 8px 14px; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button[data-v=speak] { border-color: var(--speak); } button[data-v=silent] { border-color: var(--silent); }
  button[data-v=wrong_object] { border-color: var(--wrong); } button[data-v=unclear] { border-color: var(--unclear); }
  button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color:#fff; }
  .kbd { font-weight:400; color:var(--muted); font-size:13px; margin-left:6px; }
  button[aria-pressed=true] .kbd { color:#fff; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:end; margin-top:12px; }
  label { display:block; font-size:15px; color:var(--muted); }
  input, textarea { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  input { width: 8em; } textarea { width:100%; min-height:60px; }
  nav { display:flex; justify-content:space-between; margin-top:16px; gap:12px; }
  progress { width: 220px; height: 8px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  @media (prefers-reduced-motion: no-preference) { button { transition: background .15s, border-color .15s; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="question" tabindex="-1"></h1>
      <div class="muted" id="meta"></div>
    </div>
    <div class="muted"><span id="count"></span><br><progress id="prog" max="1" value="0" aria-label="Review progress"></progress></div>
  </header>

  <section class="card" aria-labelledby="frames-h">
    <h2 class="sr" id="frames-h">Frames around the question</h2>
    <div class="strip" id="strip"></div>
    <div class="muted">Blue border: inside the derived window. Orange: the moment the question was asked.</div>
  </section>

  <section class="card" aria-labelledby="ctx-h">
    <h2 class="sr" id="ctx-h">Context</h2>
    <dl>
      <dt>Derived objects</dt><dd id="labels"></dd>
      <dt>Derived window</dt><dd id="window"></dd>
      <dt>Question type</dt><dd id="qtype"></dd>
      <dt>Answers given</dt><dd id="answers"></dd>
    </dl>
  </section>

  <section class="card" aria-labelledby="v-h">
    <h2 id="v-h" style="font-size:20px;margin:0 0 12px">Should the assistant have spoken up about this, unprompted?</h2>
    <div class="actions" role="group" aria-labelledby="v-h" id="actions"></div>
    <div class="row">
      <div><label for="w0">Corrected window start (s)</label><input id="w0" inputmode="decimal"></div>
      <div><label for="w1">Corrected window end (s)</label><input id="w1" inputmode="decimal"></div>
      <div style="flex:1;min-width:240px"><label for="note">Note (what object, if wrong)</label><textarea id="note"></textarea></div>
    </div>
    <nav>
      <button id="prev">Previous <span class="kbd">←</span></button>
      <button id="next">Next unreviewed <span class="kbd">→</span></button>
    </nav>
  </section>
  <div id="status" class="muted" role="status" aria-live="polite"></div>
</main>
<script>
const D = __DATA__;
const NAMES = { speak: "Speak", silent: "Stay silent", wrong_object: "Wrong object", unclear: "Unclear" };
let done = {}, i = 0;
const $ = id => document.getElementById(id);
const txt = (id, s) => { $(id).textContent = s; };

D.verdicts.forEach((v, k) => {
  const b = document.createElement("button");
  b.dataset.v = v; b.setAttribute("aria-pressed", "false");
  b.append(NAMES[v]); const s = document.createElement("span"); s.className = "kbd"; s.textContent = String(k + 1); b.append(s);
  b.addEventListener("click", () => save(v));
  $("actions").append(b);
});

function show(n) {
  i = Math.max(0, Math.min(D.events.length - 1, n));
  const e = D.events[i], prev = done[e.key];
  txt("question", e.question);
  txt("meta", `Video ${e.video_id}, event ${e.obj_id}, asked at ${Number(e.t_q).toFixed(1)} s`);
  txt("labels", e.labels || "none");
  txt("window", `${e.win[0].toFixed(1)} to ${e.win[1].toFixed(1)} s`);
  txt("qtype", e.qtype || "");
  txt("answers", (e.answers || "").split(" || ").slice(0, 3).join("  /  "));
  const strip = $("strip"); strip.replaceChildren();
  if (!e.times.length) { const p = document.createElement("p"); p.textContent = "No frames extracted yet: run the frames command."; strip.append(p); }
  e.times.forEach((t, k) => {
    const f = document.createElement("figure");
    if (t >= e.win[0] && t <= e.win[1]) f.classList.add("inwin");
    if (Math.abs(t - Number(e.t_q)) < 0.4) f.classList.add("q");
    const img = document.createElement("img");
    img.src = `/frames/${e.key.replace(":", "_")}/${String(k).padStart(2, "0")}.jpg`;
    img.alt = `Frame at ${t.toFixed(1)} seconds`; img.loading = "lazy";
    const c = document.createElement("figcaption"); c.textContent = `${t.toFixed(1)} s`;
    f.append(img, c); strip.append(f);
  });
  $("w0").value = prev && prev.window ? prev.window[0] : "";
  $("w1").value = prev && prev.window ? prev.window[1] : "";
  $("note").value = prev ? prev.note || "" : "";
  document.querySelectorAll("#actions button").forEach(b => b.setAttribute("aria-pressed", String(!!prev && prev.verdict === b.dataset.v)));
  const reviewed = Object.keys(done).filter(k => D.events.some(ev => ev.key === k)).length;
  txt("count", `${i + 1} of ${D.events.length} (${reviewed} reviewed)`);
  $("prog").max = D.events.length; $("prog").value = reviewed;
  $("question").focus();
  shownAt = performance.now();
}

const MIN_LOOK_MS = 2000;   // a verdict needs at least this long with the event on screen
let shownAt = 0, saving = false;

async function save(v) {
  const waited = performance.now() - shownAt;
  if (saving) return;
  if (waited < MIN_LOOK_MS) {
    txt("status", `Not saved: look at the frames first (${((MIN_LOOK_MS - waited) / 1000).toFixed(1)} s more).`);
    return;
  }
  saving = true;
  try { await post(v); } finally { saving = false; }
}

async function post(v) {
  const e = D.events[i], a = $("w0").value.trim(), b = $("w1").value.trim();
  const body = { key: e.key, verdict: v, note: $("note").value };
  if (a !== "" || b !== "") body.window = [Number(a), Number(b)];
  const r = await fetch("/verdict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { txt("status", `Not saved: ${await r.text()}`); return; }
  done[e.key] = await r.json();
  txt("status", `Saved: ${NAMES[v]} for event ${e.key}.`);
  nextUnreviewed();
}

function nextUnreviewed() {
  for (let k = 1; k <= D.events.length; k++) {
    const j = (i + k) % D.events.length;
    if (!done[D.events[j].key]) return show(j);
  }
  txt("status", "Every event has a verdict."); show(i);
}

$("prev").addEventListener("click", () => show(i - 1));
$("next").addEventListener("click", nextUnreviewed);
document.addEventListener("keydown", ev => {
  if (ev.repeat) return;                       // a held-down key must never record verdicts
  if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  const k = Number(ev.key);
  if (k >= 1 && k <= D.verdicts.length) { ev.preventDefault(); save(D.verdicts[k - 1]); }
  else if (ev.key === "ArrowLeft") show(i - 1);
  else if (ev.key === "ArrowRight") nextUnreviewed();
});

fetch("/verdicts").then(r => r.json()).then(v => {
  done = v;
  const first = D.events.findIndex(e => !done[e.key]);
  show(first === -1 ? 0 : first);
});
</script>
</body>
</html>
