tracker:
  iou_threshold: 0.3
  max_age: 8
  n_init: 2
  conf_ema: 0.6
  text_similarity: 0.6
cacs:
  weights:
    alpha: 0.5
    beta: 1.5
    gamma: 1.0
    delta: 2.0
    eta: 2.0
    lam: 2.5
  threshold: 3.3
  min_confidence: 0.35
  sure_confidence: 0.6
  duplicate_tau: 8.0
  label_duplicate_tau: 4.0
  move_reset: 0.25
  approach_boost: 0.5
  decision_interval: 0.5
  max_cues_per_decision: 1
  use_novelty: true
  use_proximity: true
  use_uncertainty: true
  use_temporal_memory: true
  use_relevance: true
  use_text: true
  use_scene_context: true
baseline:
  confidence_threshold: 0.5
  cooldown: 5.0
  decision_interval: 0.5
  max_cues_per_decision: 1
speech:
  min_gap: 1.2
  seconds_per_word: 0.35
perception:
  yolo_model: yolo11n.pt
  yolo_conf: 0.25
  yolo_imgsz: 640
  device: auto
  ocr_every_n_frames: 8
  ocr_min_conf: 0.3
  ocr_languages:
  - en
  frame_width: 640
